# Dual-ingest manifest: one entry per company per fiscal year.
# Per-quarter fetch flags + transcript URLs.
#
# name: colloquial name (stored on chunks as company_name)
# include: true → company is selected by default fetch (unless --ticker / --all)
# quarters.Qn.fetch: true → that quarter is expanded into a fetch job
# quarters.Qn.form: null → auto (Q4 → 10-K, Q1–Q3 → 10-Q)
# quarters.Qn.transcript_url: Motley Fool preferred; ROIC.ai / other hosts ok
#   (parser is chosen from the URL host — Fool, ROIC, or general HTML)

companies:
  - ticker: AAPL
    name: Apple
    fiscal_year: 2025
    include: true
    quarters:
      Q1:
        fetch: true
        transcript_url: "https://www.fool.com/earnings/call-transcripts/2025/01/30/apple-aapl-q1-2025-earnings-call-transcript/"
