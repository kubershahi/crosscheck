[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscheck"
version = "0.1.0"
description = "Cross-document RAG for earnings-call vs SEC filing consistency checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pydantic>=2.5.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "sentence-transformers>=3.0.0",
  "faiss-cpu>=1.8.0",
  "instructor>=1.7.0",
  "openai>=1.50.0",
  "google-genai>=1.0.0",
  "jsonref>=1.1.0",
  "torch>=2.2.0",
  "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
where = ["src"]
