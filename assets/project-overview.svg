<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A3F46"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F98"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1F2328; }
      .mono { font-family: Menlo, Monaco, "Courier New", monospace; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #5C6168; }
      .band-label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #6B6F76; }
      .h { font-size: 18px; font-weight: 700; }
      .b { font-size: 15px; }
      .s { font-size: 13px; fill: #5C6168; }
      .xs { font-size: 12px; fill: #6B6F76; }
      .k { font-size: 14px; font-weight: 700; }
      .band { fill: #F2ECE2; }
      .card { fill: #FFFFFF; stroke: #D6CEC0; stroke-width: 1.5; }
      .sub { fill: #F7F4EE; stroke: #D6CEC0; stroke-width: 1.2; }
      .flow { stroke: #3A3F46; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .flow-muted { stroke: #8A8F98; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FAF7F2"/>

  <!-- Header -->
  <text x="40" y="60" class="title">Crosscheck</text>
  <text x="252" y="60" class="subtitle">Earnings-call claims checked against the same quarter&#8217;s SEC filing, with retrieval and NLI scored separately</text>

  <!-- 1 Offline -->
  <rect x="20" y="96" width="1560" height="182" rx="14" class="band"/>
  <text x="40" y="124" class="band-label">&#9312; OFFLINE &#183; BUILD THE CORPUS</text>

  <g>
    <rect x="40" y="140" width="272" height="118" rx="10" class="card"/>
    <text x="58" y="170" class="h">Fetch</text>
    <text x="58" y="196" class="b">SEC EDGAR 10-Q / 10-K HTML</text>
    <text x="58" y="218" class="b">Earnings-call transcripts</text>
    <text x="58" y="242" class="s">5 tickers &#215; FY2025 Q1&#8211;Q4</text>

    <rect x="352" y="140" width="272" height="118" rx="10" class="card"/>
    <text x="370" y="170" class="h">Chunk</text>
    <text x="370" y="196" class="b">Filings split on Item / PART</text>
    <text x="370" y="218" class="b">Each table &#8594; one Markdown chunk</text>
    <text x="370" y="242" class="s">Transcripts split by speaker turn</text>

    <rect x="664" y="140" width="272" height="118" rx="10" class="card"/>
    <text x="682" y="170" class="h">Embed</text>
    <text x="682" y="196" class="b">BGE-M3 dense vectors (local)</text>
    <text x="682" y="218" class="b">BM25 sparse vectors</text>
    <text x="682" y="242" class="s">MPS / CUDA / CPU</text>

    <rect x="976" y="140" width="272" height="118" rx="10" class="card"/>
    <text x="994" y="170" class="h">Index &#183; Qdrant Cloud</text>
    <text x="994" y="196" class="b">Filings + transcripts collections</text>
    <text x="994" y="218" class="b">Payload: ticker &#183; FY &#183; quarter</text>
    <text x="994" y="242" class="s">form type, section, is_table</text>

    <rect x="1288" y="140" width="272" height="118" rx="10" class="card"/>
    <text x="1306" y="170" class="h">Extract claims</text>
    <text x="1306" y="196" class="b">Gemini, one call per transcript</text>
    <text x="1306" y="218" class="b">Numeric, current-quarter claims</text>
    <text x="1306" y="242" class="s">Each tagged with its speaker</text>

    <line x1="314" y1="199" x2="348" y2="199" class="flow"/>
    <line x1="626" y1="199" x2="660" y2="199" class="flow"/>
    <line x1="938" y1="199" x2="972" y2="199" class="flow"/>
    <line x1="1250" y1="199" x2="1284" y2="199" class="flow"/>
  </g>

  <!-- 2 Online -->
  <rect x="20" y="300" width="1560" height="400" rx="14" class="band"/>

  <!-- claims feed the online path -->
  <path d="M1424,260 V288 H270 V361" class="flow-muted"/>
  <text x="40" y="328" class="band-label">&#9313; PER CLAIM</text>

  <!-- RAG / NLI brackets -->
  <path d="M340,352 V344 H1230 V352" stroke="#2F6FEB" stroke-width="2" fill="none"/>
  <rect x="705" y="333" width="160" height="22" rx="11" fill="#2F6FEB"/>
  <text x="785" y="349" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF;letter-spacing:1px">RAG &#183; RETRIEVAL</text>
  <path d="M1260,352 V344 H1560 V352" stroke="#7A4FD8" stroke-width="2" fill="none"/>
  <rect x="1330" y="333" width="160" height="22" rx="11" fill="#7A4FD8"/>
  <text x="1410" y="349" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF;letter-spacing:1px">NLI &#183; VERIFY</text>

  <!-- Claim card -->
  <rect x="40" y="365" width="270" height="275" rx="10" class="card"/>
  <text x="58" y="395" class="h">Earnings-call claim</text>
  <text x="58" y="419" class="s">AAPL &#183; FY2025 Q1 &#183; CFO Kevan Parekh</text>
  <rect x="58" y="438" width="4" height="78" rx="2" fill="#C9BFAE"/>
  <text x="74" y="458" style="font-size:17px;font-style:italic">&#8220;Mac revenue was $9 billion</text>
  <text x="74" y="482" style="font-size:17px;font-style:italic">for the December quarter,</text>
  <text x="74" y="506" style="font-size:17px;font-style:italic">16% higher year over year.&#8221;</text>
  <text x="58" y="552" class="s">Golden label</text>
  <rect x="58" y="562" width="104" height="26" rx="13" fill="#E3F3E9" stroke="#2E9E5B"/>
  <text x="110" y="580" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#1E7A43">Consistent</text>
  <text x="58" y="622" class="xs mono">AAPL_2025_Q1_02</text>

  <!-- Prepare query -->
  <rect x="340" y="365" width="250" height="275" rx="10" class="card"/>
  <text x="358" y="395" class="h">Prepare query</text>
  <text x="358" y="428" class="k">Unit expansion</text>
  <text x="358" y="449" class="mono" style="font-size:13.5px">$9 billion &#8594; 9,000 million</text>
  <text x="358" y="482" class="k">Synonyms</text>
  <text x="358" y="503" class="mono" style="font-size:13.5px">revenue &#8596; net sales</text>
  <text x="358" y="536" class="k">Period filter</text>
  <text x="358" y="557" class="mono" style="font-size:13.5px">ticker = AAPL</text>
  <text x="358" y="577" class="mono" style="font-size:13.5px">FY2025 &#183; Q1 &#183; 10-Q</text>
  <text x="358" y="620" class="s">Same company, same quarter only</text>

  <!-- Hybrid retrieve + rerank -->
  <rect x="620" y="365" width="250" height="275" rx="10" class="card"/>
  <text x="638" y="395" class="h">Hybrid retrieve</text>
  <rect x="636" y="412" width="104" height="56" rx="8" class="sub"/>
  <text x="688" y="436" text-anchor="middle" class="k">Dense</text>
  <text x="688" y="456" text-anchor="middle" class="s">BGE-M3 &#183; 50</text>
  <rect x="750" y="412" width="104" height="56" rx="8" class="sub"/>
  <text x="802" y="436" text-anchor="middle" class="k">Sparse</text>
  <text x="802" y="456" text-anchor="middle" class="s">BM25 &#183; 50</text>
  <line x1="688" y1="470" x2="730" y2="494" class="flow"/>
  <line x1="802" y1="470" x2="760" y2="494" class="flow"/>
  <rect x="660" y="497" width="170" height="36" rx="8" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.2"/>
  <text x="745" y="520" text-anchor="middle" class="k">RRF fusion</text>
  <line x1="745" y1="535" x2="745" y2="555" class="flow"/>
  <rect x="636" y="558" width="218" height="66" rx="8" fill="#E8F0FE" stroke="#2F6FEB" stroke-width="1.2"/>
  <text x="745" y="583" text-anchor="middle" class="k">Rerank &#183; 50 &#8594; 5</text>
  <text x="745" y="604" text-anchor="middle" class="s">Pinecone bge-reranker-v2-m3</text>

  <!-- Top-5 passages -->
  <rect x="900" y="365" width="330" height="275" rx="10" class="card"/>
  <text x="918" y="395" class="h">Top-5 filing passages</text>
  <text x="918" y="416" class="s">AAPL 10-Q &#183; quarter ended Dec 28, 2024</text>

  <g>
    <rect x="914" y="430" width="302" height="34" rx="7" class="sub"/>
    <circle cx="933" cy="447" r="10" fill="#FFFFFF" stroke="#8A8F98"/>
    <text x="933" y="451.5" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
    <text x="952" y="452" style="font-size:13.5px">Balance sheet</text>
    <text x="1204" y="452" text-anchor="end" class="xs">Item 1 &#183; table</text>

    <rect x="914" y="469" width="302" height="34" rx="7" class="sub"/>
    <circle cx="933" cy="486" r="10" fill="#FFFFFF" stroke="#8A8F98"/>
    <text x="933" y="490.5" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
    <text x="952" y="491" style="font-size:13.5px">Statement of operations</text>
    <text x="1204" y="491" text-anchor="end" class="xs">Item 1 &#183; table</text>

    <rect x="914" y="508" width="302" height="34" rx="7" class="sub"/>
    <circle cx="933" cy="525" r="10" fill="#FFFFFF" stroke="#8A8F98"/>
    <text x="933" y="529.5" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
    <text x="952" y="530" style="font-size:13.5px">Cash flows</text>
    <text x="1204" y="530" text-anchor="end" class="xs">Item 1 &#183; table</text>

    <rect x="914" y="547" width="302" height="34" rx="7" fill="#E3F3E9" stroke="#2E9E5B" stroke-width="1.4"/>
    <circle cx="933" cy="564" r="10" fill="#2E9E5B"/>
    <text x="933" y="568.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#FFFFFF">4</text>
    <text x="952" y="569" style="font-size:13.5px">Note 2 &#183; Revenue</text>
    <text x="1204" y="569" text-anchor="end" style="font-size:13px;font-weight:700;fill:#1E7A43">Mac $8,987M</text>

    <rect x="914" y="586" width="302" height="34" rx="7" fill="#E3F3E9" stroke="#2E9E5B" stroke-width="1.4"/>
    <circle cx="933" cy="603" r="10" fill="#2E9E5B"/>
    <text x="933" y="607.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#FFFFFF">5</text>
    <text x="952" y="608" style="font-size:13.5px">MD&amp;A &#183; Products</text>
    <text x="1204" y="608" text-anchor="end" style="font-size:13px;font-weight:700;fill:#1E7A43">$8,987M &#183; +16%</text>
  </g>

  <!-- NLI verdict -->
  <rect x="1260" y="365" width="300" height="275" rx="10" class="card"/>
  <text x="1278" y="395" class="h">Gemini NLI</text>
  <text x="1278" y="416" class="s">Structured JSON: label, confidence, reasoning</text>
  <rect x="1278" y="430" width="264" height="44" rx="10" fill="#2E9E5B"/>
  <text x="1296" y="459" style="font-size:19px;font-weight:700;fill:#FFFFFF;letter-spacing:1px">CONSISTENT</text>
  <text x="1526" y="458" text-anchor="end" style="font-size:14px;fill:#FFFFFF">conf 1.00</text>
  <text x="1278" y="502" class="s">Reasoning cites</text>
  <rect x="1382" y="487" width="78" height="22" rx="11" fill="#E3F3E9" stroke="#2E9E5B"/>
  <text x="1421" y="502.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#1E7A43">Passage 4</text>
  <rect x="1466" y="487" width="78" height="22" rx="11" fill="#E3F3E9" stroke="#2E9E5B"/>
  <text x="1505" y="502.5" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#1E7A43">Passage 5</text>
  <rect x="1278" y="522" width="4" height="62" rx="2" fill="#C9BFAE"/>
  <text x="1292" y="538" style="font-size:13.5px;font-style:italic">&#8220;Mac net sales were $8,987 million</text>
  <text x="1292" y="557" style="font-size:13.5px;font-style:italic">(&#8776; $9 billion), and Passage 5 states</text>
  <text x="1292" y="576" style="font-size:13.5px;font-style:italic">a 16% change year over year.&#8221;</text>
  <circle cx="1284" cy="617" r="5" fill="#2E9E5B"/>
  <text x="1294" y="621" class="xs">Consistent</text>
  <circle cx="1374" cy="617" r="5" fill="#D1453B"/>
  <text x="1384" y="621" class="xs">Contradictory</text>
  <circle cx="1474" cy="617" r="5" fill="#8A8F98"/>
  <text x="1484" y="621" class="xs">Unverifiable</text>

  <!-- flow arrows in 2 -->
  <line x1="312" y1="502" x2="336" y2="502" class="flow"/>
  <line x1="592" y1="502" x2="616" y2="502" class="flow"/>
  <line x1="872" y1="502" x2="896" y2="502" class="flow"/>
  <line x1="1232" y1="502" x2="1256" y2="502" class="flow"/>

  <!-- Q4 note + citations note -->
  <rect x="340" y="652" width="890" height="34" rx="8" fill="#FFFFFF" stroke="#2F6FEB" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="358" y="674" class="b"><tspan font-weight="700">Q4 claims</tspan> run two stacks: FY 10-K (top 4) + Q3 10-Q (top 4), each hybrid + rerank, then merged for NLI</text>
  <rect x="1260" y="652" width="300" height="34" rx="8" fill="#FFFFFF" stroke="#7A4FD8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1410" y="674" text-anchor="middle" class="b">Citations come from retrieval</text>

  <!-- 3 Golden eval -->
  <rect x="20" y="714" width="1560" height="266" rx="14" class="band"/>
  <text x="40" y="742" class="band-label">&#9314; GOLDEN EVAL &#183; 160 CLAIMS &#183; RETRIEVAL AND NLI SCORED SEPARATELY</text>

  <!-- Golden set -->
  <rect x="40" y="758" width="400" height="206" rx="10" class="card"/>
  <text x="58" y="788" class="h">Golden set</text>
  <text x="58" y="814" class="b">5 tickers &#215; 4 quarters &#215; 8 claims</text>
  <text x="58" y="838" class="mono" style="font-size:13px;fill:#5C6168">AAPL &#183; AMZN &#183; GOOGL &#183; META &#183; NVDA</text>
  <rect x="58" y="858" width="182" height="24" fill="#2E9E5B"/>
  <rect x="240" y="858" width="91" height="24" fill="#D1453B"/>
  <rect x="331" y="858" width="91" height="24" fill="#8A8F98"/>
  <text x="149" y="875" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF">4 Consistent</text>
  <text x="285.5" y="875" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF">2 Contra.</text>
  <text x="376.5" y="875" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF">2 Unverif.</text>
  <text x="58" y="910" class="s">per company-quarter</text>
  <text x="58" y="940" class="s">Drafted, verified live, then promoted</text>

  <!-- Retrieval hit rule -->
  <rect x="470" y="758" width="520" height="206" rx="10" class="card"/>
  <text x="488" y="788" class="h">Retrieval hit (Consistent + Contradictory)</text>
  <text x="488" y="814" class="b">Hit when &gt; 50% of truth tokens appear in the NLI reasoning</text>
  <text x="488" y="836" class="s">Truth tokens = reference $ / % figures + claim keywords</text>

  <g>
    <rect x="488" y="850" width="66" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="521" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">pct:16</text>
    <rect x="560" y="850" width="100" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="610" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">usd_m:8987</text>
    <rect x="666" y="850" width="44" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="688" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">mac</text>
    <rect x="716" y="850" width="76" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="754" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">revenue</text>
    <rect x="798" y="850" width="84" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="840" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">december</text>
    <rect x="888" y="850" width="66" height="26" rx="6" fill="#E3F3E9" stroke="#2E9E5B"/>
    <text x="921" y="868" text-anchor="middle" class="mono" style="font-size:13px;fill:#1E7A43">higher</text>
    <rect x="488" y="884" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#8A8F98" stroke-dasharray="4 3"/>
    <text x="538" y="902" text-anchor="middle" class="mono" style="font-size:13px;fill:#8A8F98;text-decoration:line-through">usd_m:7780</text>
    <text x="598" y="902" class="s">missing (prior-year figure)</text>
  </g>
  <text x="488" y="944" style="font-size:16px;font-weight:700;fill:#1E7A43">6 / 7 tokens = 86% &#8594; hit</text>
  <text x="972" y="944" text-anchor="end" class="s">bucket: both_ok</text>

  <!-- Metrics -->
  <g>
    <rect x="1020" y="758" width="128" height="104" rx="10" class="card"/>
    <text x="1084" y="798" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#2F6FEB">95.8%</text>
    <text x="1084" y="822" text-anchor="middle" class="k" style="font-size:13px">Recall@k (C/X)</text>
    <text x="1084" y="844" text-anchor="middle" class="xs">115 / 120</text>

    <rect x="1157" y="758" width="128" height="104" rx="10" class="card"/>
    <text x="1221" y="798" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#7A4FD8">89.2%</text>
    <text x="1221" y="822" text-anchor="middle" class="k" style="font-size:13px">NLI acc (C/X)</text>
    <text x="1221" y="844" text-anchor="middle" class="xs">107 / 120</text>

    <rect x="1294" y="758" width="128" height="104" rx="10" class="card"/>
    <text x="1358" y="798" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#7A4FD8">91.9%</text>
    <text x="1358" y="822" text-anchor="middle" class="k" style="font-size:13px">NLI acc (all)</text>
    <text x="1358" y="844" text-anchor="middle" class="xs">147 / 160</text>

    <rect x="1431" y="758" width="129" height="104" rx="10" class="card"/>
    <text x="1495.5" y="798" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#7A4FD8">100%</text>
    <text x="1495.5" y="822" text-anchor="middle" class="k" style="font-size:13px">Unverifiable</text>
    <text x="1495.5" y="844" text-anchor="middle" class="xs">40 / 40</text>
  </g>

  <!-- Buckets bar -->
  <text x="1020" y="892" class="s">Retrieval &#215; NLI on 120 C/X claims</text>
  <rect x="1020" y="902" width="468" height="24" fill="#2E9E5B"/>
  <rect x="1488" y="902" width="49.5" height="24" fill="#E0A23B"/>
  <rect x="1537.5" y="902" width="13.5" height="24" fill="#2F6FEB"/>
  <rect x="1551" y="902" width="9" height="24" fill="#D1453B"/>
  <text x="1254" y="919" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#FFFFFF">both correct &#183; 104</text>
  <circle cx="1026" cy="949" r="5" fill="#E0A23B"/>
  <text x="1036" y="953" class="xs">NLI wrong 11</text>
  <circle cx="1128" cy="949" r="5" fill="#2F6FEB"/>
  <text x="1138" y="953" class="xs">lucky NLI 3</text>
  <circle cx="1222" cy="949" r="5" fill="#D1453B"/>
  <text x="1232" y="953" class="xs">both fail 2</text>
  <text x="1560" y="953" text-anchor="end" class="xs">eval_20260827_074408</text>
</svg>
